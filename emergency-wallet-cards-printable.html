<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printable Emergency Wallet Cards | LivSolv</title><style>body{margin:0;background:#f7f4ec;color:#17221c;font-family:Arial,sans-serif}.controls{max-width:850px;margin:18px auto;display:flex;justify-content:space-between;align-items:center}.brand{font:700 24px Georgia,serif}.print{background:#173d30;color:white;border:0;border-radius:8px;padding:11px 15px;font-weight:700}.sheet{width:8.5in;min-height:11in;margin:auto;background:white;padding:.38in;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:.14in;box-sizing:border-box}.card{border:1px dashed #8da096;border-radius:8px;position:relative;padding:.12in;overflow:hidden}.head{background:#173d30;color:white;margin:-.12in -.12in .1in;padding:.09in .12in;font:700 13px Georgia,serif}.field{height:.29in;border-bottom:1px solid #c2cbc5;padding-top:.03in}.field span{font-size:6.5px;font-weight:800;color:#5d6b62}.note{position:absolute;left:.1in;right:.1in;bottom:.1in;background:#e8efe9;border-radius:5px;padding:.06in;font-size:6.5px;line-height:1.3}.note strong{font-size:7px}@media(max-width:850px){.sheet{transform-origin:top left;max-width:100%;width:100%;height:auto;min-height:0;grid-template-columns:1fr;padding:14px}.card{min-height:260px}.controls{padding:0 14px}}@media print{@page{size:letter;margin:0}.controls{display:none}.sheet{margin:0;width:8.5in;height:11in;min-height:11in;padding:.35in;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}.card{min-height:0}}</style></head><body><div class="controls"><div class="brand">LivSolv Emergency Wallet Cards</div><button class="print" onclick="window.print()">Print wallet cards</button></div><main class="sheet" id="sheet"></main><script>const card=`<div class="card"><div class="head">LivSolv Emergency Card</div><div class="field"><span>NAME</span></div><div class="field"><span>HOME ADDRESS</span></div><div class="field"><span>MY PHONE</span></div><div class="field"><span>OUT-OF-AREA CONTACT / PHONE</span></div><div class="field"><span>MEET NEAR HOME</span></div><div class="field"><span>MEET OUTSIDE NEIGHBORHOOD</span></div><div class="field"><span>CRITICAL MEDICAL NOTE</span></div><div class="note"><strong>IF CALLS FAIL: TEXT FIRST.</strong><br>Contact the out-of-area person, then use the family meeting plan. Emergency: call 911 when service is available.</div></div>`;document.getElementById('sheet').innerHTML=card.repeat(6);</script></body></html>
